<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Line & Linen</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- HEADER -->
    <header class="site-header">
        
        <!-- LOGO -->
        <div class="logo">
          <h1>Line & Linen</h1>
        </div>
        
        <!-- NAVIGATION -->
        <nav class="main-navigation">
          <a href="#">WOMEN</a>

          <a href="#">MEN</a>
        </nav>
        
        <!-- HEADER ACTIONS -->
        <div class="header-actions">
        
            <!-- SEARCH -->
            <button class="search-button">
                SEARCH
            </button>
        
            <!-- SHOPPING BAG -->
            <button class="bag-button">
                <img src="bag-outline.svg" alt="Shopping bag">
            </button>
        
            <!-- ACCOUNT -->
            <button class="account-button">
                <img src="person-outline.svg" alt="Account">
            </button>
        
            <!-- MENU -->
            <button class="menu-button">
                <img src="menu-outline.svg" alt="Menu">
            </button>
        
        </div>
    
    </header>


    <!-- MAIN CONTENT -->

    <main>

        <!-- HERO SECTION -->

        <section class="hero">

            <!-- PRODUCT INFORMATION -->

            <div class="product-info">

                <div class="product-lockup">

                    <p class="collection-label">
                        NEW COLLECTION
                    </p>
                    <h1 class="product-title">
                        RØGUE.
                    </h1>

                </div>

                <p class="product-description">
                    Cut from a darker perspective.
                    Structured silhouettes, raw textures, and unapologetic
                    attitude come together in a collection made for the city.
                </p>

                <button class="details-button">
                    <span class="details-icon"><img src="video-svgrepo-com.svg" alt=""></span>
                        DETAILS
                </button>
            </div>


            <!-- MODEL / PRODUCT IMAGE -->

            <div class="product-image">
                <img src="CLOTHES/MEN'S PRODUCT - 1.png" alt="">
            </div>


            <!-- PRODUCT OPTIONS -->

            <div class="product-options">

                <!-- COLOR -->
                <div class="color-section">
                    <p class="option-label">
                        CHOOSE YOUR COLOR
                    </p>
    
                    <div class="color-options">
                        <button class="color-button color-metal" aria-label="Metal">
                        </button>
                        <button class="color-button color-green" aria-label="Green">
                        </button>
                    </div>

                    <div class="color-names">
                        <span>METAL</span>
                        <span>GREEN</span>
                    </div>
                </div>

                <!-- PRODUCT INFORMATION -->

                <div class="product-details">
                    <p>#623357</p>
                    <p>MODEL: 6'1", 175 lbs.</p>
                    <p>SHOWN: SIZE M</p>
                </div>

                <!-- SIZE -->
                <div class="size-section">
                    <p class="option-label">
                        CHOOSE YOUR SIZE
                    </p>    

                    <div class="size-options">
                        <button>XS</button>
                        <button>S</button>
                        <button>M</button>
                        <button>L</button>
                        <button>XL</button>
                        <button>XXL</button>
                    </div>
                </div>

                <!-- ADD TO BAG -->
                <div class="purchase-section">
                    <button class="add-to-bag">
                        ADD TO SHOPPING BAG
                    </button>
                    <button class="wishlist-button" aria-label="Add to wishlist">
                        ♡
                    </button>
                </div>
            </div>

        </section>


        <!-- SECOND SECTION -->

        <section class="collection">

        </section>

    </main>


    <!-- SOCIAL LINKS -->

    <aside class="social-links">
        <nav class="social-navigation">
            <a href="#" aria-label="Facebook">
                <img src="facebook.png" alt="">
            </a>
            <a href="#" aria-label="X">
                <img src="x.png" alt="">
            </a>
            <a href="#" aria-label="Instagram">
                <img src="instagram.png" alt="">
            </a>
        </nav>
    </aside>


    <!-- FOOTER -->

    <footer>

    </footer>


    <script src="script.js"></script>
</body>

</html>
